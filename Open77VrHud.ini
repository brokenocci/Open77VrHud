enabled=1
; select: newest = disegna solo lo slot piu' recente di ogni superficie; all = tutti (come la 4.2.0)
select=newest
; formats: bgra = solo superfici Open77 (esclude i buffer occhi di REAL VR); all = tutto
formats=bgra
; superfici campionate per frame (1-8)
sampleRings=2
; followLog: 1 = legge il log di Open77 per sapere quando nasconde la schermata di connessione
followLog=1
; hideSurfaces: superfici da non mostrare mai in VR, separate da virgola
; (nomi: open77_shell, open77_pause, open77_chat, open77_notifications, nct_hud, ...)
hideSurfaces=
; staticHideMs: 0 = spento. Nasconde le superfici ferme da piu' di N ms
staticHideMs=0
tint=auto
dump=2
