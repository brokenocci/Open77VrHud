enabled=1
; select: newest = draw only the latest slot of each surface; all = draw every slot
select=newest
; formats: bgra = Open77 surfaces only (skips R.E.A.L. eye buffers); all = everything
formats=bgra
; surfaces sampled per frame (1-8)
sampleRings=2
; followLog: 1 = read the Open77 log to learn when the connection screen is hidden
followLog=1
; hideSurfaces: surfaces never shown in VR, comma-separated
; (names: open77_shell, open77_pause, open77_chat, open77_notifications, nct_hud, ...)
hideSurfaces=
; staticHideMs: 0 = off. Hide a surface that has not changed for N milliseconds
staticHideMs=0
tint=auto
dump=2
